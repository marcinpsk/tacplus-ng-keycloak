repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff
        args: [--fix]
        files: ^mavis/.*\.py$
      - id: ruff-format
        files: ^mavis/.*\.py$

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.47.0
    hooks:
      - id: markdownlint
        args: [--fix]
        files: ^(README|CLAUDE)\.md$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        files: ^(mavis/.*\.py|tests/.*|README\.md|CLAUDE\.md|Dockerfile|\.github/.*)$
      - id: end-of-file-fixer
        files: ^(mavis/.*\.py|tests/.*|README\.md|CLAUDE\.md|Dockerfile|\.github/.*)$
      - id: check-shebang-scripts-are-executable
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]

  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint-docker
        entry: ghcr.io/hadolint/hadolint hadolint --ignore DL3008
